name: 'Create .env file'
description: 'This GitHub Action helps to replace all placeholders in file'
author: 'Alexey Savelyev with AI'
inputs:
    template_path:
        description: 'The path to the template file or directory.'
        required: true
        default: ''
    json:
        description: 'JSON object {"key": "value"} with the replacement data, keys are case-insensitive.'
        required: true
    output_dir:
        description: 'Directory where modified files will be saved.'
        required: true
        default: '.'
    is_allow_unresolved:
        description: 'Allow placeholders without a value in json: true — they stay in the file, false — the step fails and lists them'
        required: false
        default: 'true'
    mask:
        description: 'Simple file mask, e.g., *.txt or *.json'
        required: false
        default: '*.json'

runs:
    using: 'node20'
    main: 'dist/index.js'