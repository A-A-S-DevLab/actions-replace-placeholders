name: 'Replace placeholders'
description: 'This GitHub Action helps to replace all placeholders in files'
author: 'Alexey Savelyev with AI'
inputs:
    configs_path:
        description: 'Path to a config file or directory, relative to the workspace'
        required: true
    configs_mask:
        description: 'File name mask: * — any characters, ? — one character, case-insensitive'
        required: false
        default: '*.json'
    json_data:
        description: 'JSON object {"key": "value"} with the replacement data, keys are case-insensitive'
        required: true
    is_allow_unresolved:
        description: 'Allow placeholders without a value in json_data: true — they stay in the file, false — the step fails and lists them'
        required: false
        default: 'true'
    output_path:
        description: 'Directory where the processed files are saved, relative to the workspace'
        required: true

runs:
    using: 'node24'
    main: 'dist/index.js'
